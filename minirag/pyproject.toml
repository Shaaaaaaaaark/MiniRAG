[project]
name = "minirag"
version = "0.1.0"
description = "轻量 Parent-Child 混合检索服务（Milvus + PostgreSQL）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "tiktoken>=0.7",
    "asyncpg>=0.29",
    "pymilvus>=2.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.14,<1",
]
eval = [
    "ragas==0.4.3",
    # Ragas 0.4.3 imports modules removed by langchain-community 0.4.x.
    "langchain>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["minirag*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
