# 统一编排：minirag 检索服务 + Milvus（etcd/minio/standalone/attu）+ PostgreSQL
# 用法：
#   export MINIRAG_CHAT_API_KEY=...  MINIRAG_EMBEDDING_API_KEY=...
#   docker compose up -d --build
services:
  # ---------------- 应用 ----------------
  api:
    container_name: minirag-api
    build:
      context: ./minirag
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      # 模型密钥从宿主环境注入
      MINIRAG_CHAT_API_KEY: ${MINIRAG_CHAT_API_KEY}
      MINIRAG_EMBEDDING_API_KEY: ${MINIRAG_EMBEDDING_API_KEY}
      # 存储地址指向 compose 网络内的服务名
      MILVUS_URI: http://standalone:19530
      POSTGRES_DSN: postgresql://oncall:oncall@postgres:5432/oncall
    volumes:
      # 语料目录挂载：宿主机放 .md/.txt，容器内经 /app/corpus 读取并索引
      - ./corpus:/app/corpus:ro
    depends_on:
      standalone:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- 关系库 ----------------
  postgres:
    container_name: oncall-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: oncall
      POSTGRES_DB: oncall
    ports:
      - "5432:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncall"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Milvus 依赖：etcd ----------------
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------- Milvus 依赖：minio ----------------
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------- Milvus standalone ----------------
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # ---------------- Milvus 可视化：attu ----------------
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.6
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: standalone:19530
    depends_on:
      - standalone

networks:
  default:
    name: minirag
