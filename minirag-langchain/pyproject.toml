[project]
name = "minirag-langchain"
version = "0.1.0"
description = "LangChain implementation of MiniRAG text retrieval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.2,<2",
    "langchain-milvus>=0.4,<0.5",
    "langchain-openai>=1.5,<2",
    "langchain-text-splitters>=1.1,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "tiktoken>=0.7,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.14,<1",
]

[project.scripts]
langchain-rag = "minirag_langchain.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
